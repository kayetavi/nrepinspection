<!DOCTYPE html>

<style>
:root{--bg:#eceff3;--cd:#fff;--tx:#17212f;--mu:#667389;--bd:#d5dbe4;--hd:#0b2545;--ac:#14598f;--gr:#17803f;--grb:#dff3e7;--am:#a96500;--amb:#fdecc8;--sl:#7a8699;--slb:#e6e9ef;--tr:#f4f6f9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root{color-scheme:light}

body{margin:0;background:var(--bg);color:var(--tx);font:13.5px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
a{color:var(--ac);text-decoration:none}a:hover{text-decoration:underline}
header{background:var(--hd);color:#fff;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:10;border-bottom:3px solid var(--ac)}
header h1{margin:0;font-size:16px;letter-spacing:.4px;flex:1 1 240px;text-transform:uppercase}header h1 small{display:block;font-weight:400;font-size:11px;opacity:.7;text-transform:none;letter-spacing:0}

header button{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}header button.p{background:var(--ac);border-color:var(--ac)}header button.on{background:var(--am);border-color:var(--am)}header .ib{font-size:19px;line-height:1;padding:7px 12px}header #hm{font-size:14px;font-weight:600}
#tree{position:fixed;top:0;left:0;bottom:0;width:300px;max-width:86vw;z-index:30;transform:translateX(-105%);transition:transform .2s;background:var(--cd);border-right:1px solid var(--bd);padding:calc(10px + env(safe-area-inset-top,0px)) 0 10px;overflow:auto;box-shadow:4px 0 18px rgba(0,0,0,.3)}#tree.show{transform:none}#bk{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25;display:none}#bk.show{display:block}
.th{font-size:11px;text-transform:uppercase;color:var(--mu);letter-spacing:.8px;padding:4px 14px 8px}
.tn{display:flex;align-items:center;gap:6px;padding:6px 14px;color:var(--tx);border-left:3px solid transparent}.tn:hover{background:var(--tr);text-decoration:none}.tn.on{background:var(--tr);border-left-color:var(--ac);font-weight:600}
.tn a{flex:1;color:inherit;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.l1{padding-left:14px}.l2{padding-left:44px;font-size:12.5px}
.tg{border:0;background:none;width:18px;padding:0;color:var(--mu)}.pl{font-size:11px;padding:1px 7px;border-radius:9px;background:var(--slb);color:var(--sl);font-weight:600}.pl.g{background:var(--grb);color:var(--gr)}.pl.a{background:var(--amb);color:var(--am)}
main{padding:16px 24px 70px;min-width:0;width:100%;min-height:calc(100vh - 60px)}.bc{font-size:12px;color:var(--mu)}.bc a{color:var(--mu)}h2.t{margin:2px 0 14px;font-size:21px}
.kp{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-bottom:12px}.k{background:var(--cd);border:1px solid var(--bd);border-top:3px solid var(--bd);border-radius:5px;padding:10px 12px}.k span{display:block;font-size:11px;text-transform:uppercase;color:var(--mu);letter-spacing:.5px}.k b{font-size:24px}
button.k{font:inherit;color:var(--tx);text-align:left;cursor:pointer;width:100%;transition:transform .1s,box-shadow .1s}button.k:hover{transform:translateY(-2px);box-shadow:0 3px 10px rgba(0,0,0,.15)}button.k.act{background:var(--tr);outline:2px solid var(--ac)}.cd h3 .x{float:right;font-size:11px;padding:2px 8px;text-transform:none;letter-spacing:0}.k.gr{border-top-color:var(--gr)}.k.am{border-top-color:var(--am)}.k.sl{border-top-color:var(--sl)}.k.ac{border-top-color:var(--ac)}
.g2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));margin-bottom:12px}.cd{background:var(--cd);border:1px solid var(--bd);border-radius:5px;padding:14px;margin-bottom:12px}.g2 .cd{margin:0}
.cd h3{margin:0 0 12px;font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--mu)}
.dn{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.dl div{margin:5px 0}.dl b{font-size:20px;margin-right:8px}
.sb{display:flex;height:12px;border-radius:3px;overflow:hidden;background:var(--slb);min-width:90px}.sb i{display:block;height:100%}
.sr{display:flex;align-items:center;gap:10px;margin:8px 0}.sr>span{width:96px;flex:none;font-size:12.5px}.sr .sb{flex:1;height:14px}.sr>b{width:54px;text-align:right;font-size:12px}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mu);margin-top:10px}.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:900px}th,td{padding:7px 9px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--mu);background:var(--tr);position:sticky;top:0}tbody tr:hover td,tr:hover>td{background:var(--tr)}
td.pn{background:var(--amb);color:var(--am);font-weight:700;text-align:center}td.pz{color:var(--gr);text-align:center}th.ct{text-align:center}
.c{display:inline-block;padding:1px 8px;border-radius:3px;font-size:11.5px;font-weight:600;background:var(--slb);color:var(--sl)}.c.g{background:var(--grb);color:var(--gr)}.c.a{background:var(--amb);color:var(--am)}
td select{padding:2px 4px;font-size:12px;max-width:118px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.tools input{flex:1 1 220px}
.pipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px}.st{background:var(--tr);border:1px solid var(--bd);border-top:4px solid var(--sl);border-radius:4px;padding:8px 10px}.st.g{border-top-color:var(--gr)}.st.a{border-top-color:var(--am)}.st span{display:block;font-size:11px;color:var(--mu);text-transform:uppercase}.st b{font-size:13px}
.dg{display:grid;gap:10px 20px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.dg label{display:block;font-size:11px;color:var(--mu);text-transform:uppercase}.dg div>div{font-weight:600;min-height:20px}.dg input{width:100%}
.btn{display:inline-block;background:var(--ac);color:#fff;padding:7px 14px;border-radius:5px}.btn:hover{text-decoration:none;opacity:.9}.nv{display:flex;justify-content:space-between;margin-top:12px}
.note{font-size:12px;color:var(--mu);margin-top:8px}.empty{padding:26px;text-align:center;color:var(--mu)}
.gs{position:relative;flex:1 1 260px;max-width:420px}.gs input{width:100%;background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.35)}.gs input::placeholder{color:rgba(255,255,255,.65)}
#gr{position:absolute;top:100%;left:0;right:0;background:var(--cd);color:var(--tx);border:1px solid var(--bd);border-radius:5px;margin-top:4px;max-height:60vh;overflow:auto;display:none;box-shadow:0 8px 24px rgba(0,0,0,.3)}#gr.show{display:block}#gr a{display:block;padding:7px 12px;color:var(--tx);border-bottom:1px solid var(--bd)}#gr a:hover{background:var(--tr);text-decoration:none}#gr a small{display:block;color:var(--mu)}#gr .gh{padding:5px 12px;font-size:10.5px;text-transform:uppercase;color:var(--mu);background:var(--tr)}
.tsf{display:block;width:100%;max-width:340px;margin:0 0 8px}#tq{width:100%}
footer{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--hd);color:rgba(255,255,255,.85);padding:8px 24px calc(8px + env(safe-area-inset-bottom,0px));font-size:12px;display:flex;flex-wrap:wrap;gap:4px 24px;justify-content:space-between;align-items:center;border-top:3px solid var(--ac)}footer a{color:#fff;font-weight:600}footer .fl{display:flex;gap:16px;flex-wrap:wrap;align-items:center}footer button{background:transparent;color:#fff;border-color:rgba(255,255,255,.35);padding:3px 10px;font-size:12px}
#lg{position:fixed;inset:0;z-index:100;background:linear-gradient(135deg,var(--hd),#14598f);display:flex;align-items:center;justify-content:center;padding:16px}.lb{background:var(--cd);color:var(--tx);border-radius:8px;padding:28px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.4)}.lb h2{margin:6px 0 4px}.lb p{color:var(--mu);margin:0 0 10px;font-size:12.5px}.lb label{display:block;font-size:11px;text-transform:uppercase;color:var(--mu);margin:12px 0 4px}.lb input{width:100%;padding:9px 10px}.lb button{width:100%;margin-top:18px;padding:10px;background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}#le{color:#d33;min-height:18px;font-size:12.5px;margin-top:10px}
@media(max-width:900px){main{padding:12px 12px 64px}footer .fl span,footer .cp{display:none}footer{padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px))}}
</style></head><body>
<header><button id="mb" class="ib" title="Open units menu" aria-label="Open units menu">☰</button><button id="hm" class="ib" title="Overall project summary">⌂ Home</button><h1>NRL · NREP Inspection &amp; Acceptance Monitor<small id="meta"></small></h1><div class="gs"><input id="gs" placeholder="🔍 Search tag, equipment, system, unit…" autocomplete="off"><div id="gr"></div></div>
<button class="p" id="up">⬆ Upload Excel</button><input type="file" id="f" accept=".xlsx,.xlsm,.xls" hidden><button id="ed">✎ Edit mode</button><button id="dl">⬇ Download Excel</button><button id="rs">↺ Reset</button><span id="who" style="font-size:12px;opacity:.85"></span><button id="lo">⏻ Logout</button></header>
<div id="lg"><div class="lb"><div style="font-size:30px">🏭</div><h2>NREP Inspection Monitor</h2><p>NRL · Please sign in to continue</p><label for="lu">User ID</label><input id="lu" autocomplete="username"><label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password"><button id="li">Sign in</button><div id="le"></div></div></div><div id="bk"></div><nav id="tree"></nav><main id="main"></main>
<footer><div><b>NRL · NREP Project</b> — Inspection &amp; Acceptance Monitor · <span id="fm"></span></div><div class="fl"><a href="#">⌂ Home</a><span>Source: Equipment Master (Excel)</span><button onclick="scrollTo({top:0,behavior:'smooth'})">↑ Back to top</button></div><div class="cp">© 2026 NRL · NREP · For internal use</div></footer>
<script>
const UNITS=["Boilers & HRSG","DM/CPU","N2U","CA/IA","CT","RWDU","RW Filter Package","Raw Water Reservoir","FW Pump House","ETP"];
const H=["Unit","Area / Package","System No.","Equipment Tag No.","Equipment Description","Equipment Type","RFI No.","Format-I Status","Format-I Date","Format-II Status","Format-II Date","Format-III Status","Format-III Date","Category-A Status","Internal Inspection Status","Media Filling Clearance","Punch Points Category Closed","Final System Acceptance","Last Inspection Date","Responsible Agency / Person","Remarks","Link"];
const ST=["Format-I Status","Format-II Status","Format-III Status","Category-A Status","Internal Inspection Status","Media Filling Clearance","Final System Acceptance"];
const SH=["Format-I","Format-II","Format-III","Cat-A","Internal Insp.","Media Fill","Final Accept."];
const OPT=["","Not Started","Pending","Received","Issued","Accepted","Open","Closed","In Progress","Completed","Cleared","On Hold","Not Applicable"];
const DONE=["received","issued","accepted","closed","completed","cleared"];
const SAMPLE=[{"Unit":"DM/CPU","Area / Package":"DM","System No.":"1U59-PRS-01 (Raw Water System)","Equipment Tag No.":"1U59-TT-4831","Equipment Description":"Equalization Tank","Equipment Type":"Tank","Format-I Status":"Received","Format-I Date":"2025-08-21","Format-II Status":"Issued","Format-II Date":"2026-03-27","Format-III Status":"Accepted","Format-III Date":"2026-04-23","Category-A Status":"Closed","Internal Inspection Status":"Completed","Media Filling Clearance":"Not Applicable","Punch Points Category Closed":"A","Final System Acceptance":"Pending","Last Inspection Date":"2026-04-23","Responsible Agency / Person":"Ion Exchange"},{"Equipment Tag No.":"1U59-TT-5133A","Equipment Description":"Degasser Water Storage Tank","Equipment Type":"Tank"},{"Equipment Tag No.":"1U59-TT-5133B","Equipment Description":"Degasser Water Storage Tank","Equipment Type":"Tank"},{"Equipment Tag No.":"1U59-TT-5133C","Equipment Description":"Degasser Water Storage Tank","Equipment Type":"Tank"},{"Equipment Tag No.":"1U59-TT-5133D","Equipment Description":"Degasser Water Storage Tank","Equipment Type":"Tank"},{"Equipment Tag No.":"1U59-TT-8631","Equipment Description":"BULK ACID STORAGE TANK","Equipment Type":"Tank"},{"Equipment Tag No.":"1U59-TT-8731","Equipment Description":"BULK ALKALI STORAGE TANK","Equipment Type":"Tank"},{"Equipment Tag No.":"1U59-TT-4633","Equipment Description":"DM WATER STORAGE TANK","Equipment Type":"Tank"},{"Equipment Tag No.":"1U59-TT-4634","Equipment Description":"DM WATER STORAGE TANK","Equipment Type":"Tank"},{"Equipment Tag No.":"1U59-TT-5635","Equipment Description":"POLISHED CONDENSATE STORAGE TANK","Equipment Type":"Tank"},{"Equipment Tag No.":"1U59-TT-5631","Equipment Description":"FEED CONDENSTAE STORAGE TANK","Equipment Type":"Tank"},{"Equipment Tag No.":"1U59-TT-8632","Equipment Description":"ACID MEASURING TANK FOR LBC","Equipment Type":"Tank"},{"Equipment Tag No.":"1U59-TT-8633","Equipment Description":"ACID MEASURING TANK FOR MB","Equipment Type":"Tank"},{"Equipment Tag No.":"1U59-TT-8634","Equipment Description":"ACID MEASURING TANK FOR N-PIT","Equipment Type":"Tank"},{"Equipment Tag No.":"1U59-TT-9331","Equipment Description":"MORPHOLINE CHEMICAL PREPARATION TANK","Equipment Type":"Tank"},{"Equipment Tag No.":"1U59-TT-9332","Equipment Description":"MORPHOLINE DOSING TANK","Equipment Type":"Tank"},{"Equipment Tag No.":"1U59-TT-8732","Equipment Description":"ALKALI MEASURING TANK FOR LBA","Equipment Type":"Tank"},{"Equipment Tag No.":"1U59-TT-8733","Equipment Description":"ALKALI MEASURING TANK FOR MB","Equipment Type":"Tank"},{"Equipment Tag No.":"1U59-TT-8734","Equipment Description":"ALKALI MEASURING TANK FOR N-PIT","Equipment Type":"Tank"},{"Equipment Tag No.":"1U59-TT-8635","Equipment Description":"ACID MEASURING TANK FOR CPU MB","Equipment Type":"Tank"},{"Equipment Tag No.":"1U59-TT-8735","Equipment Description":"CAUSTIC MEASURING TANK FOR CPU MB","Equipment Type":"Tank"}];
let rows=[],T=[],sel={l:"p"},edit=false,open=new Set(),key="nrep_rows_v1";
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const slug=s=>String(s).replace(/[^A-Za-z0-9]+/g,"-");
const lc=v=>String(v||"").toLowerCase();
function fill(a){let u="",s="";return a.map(r=>{r=Object.assign({},r);if(r.Unit)u=r.Unit;else r.Unit=u||"Unassigned";if(r["System No."])s=r["System No."];else r["System No."]=s||"System not assigned";return r})}
function load(){try{const t=localStorage.getItem(key);if(t){rows=JSON.parse(t);return}}catch(e){}rows=fill(SAMPLE)}
function save(){try{localStorage.setItem(key,JSON.stringify(rows))}catch(e){}}
const cls=v=>DONE.includes(lc(v))?"g":["pending","open","in progress","on hold"].includes(lc(v))?"a":"";
const chip=v=>`<span class="c ${cls(v)}">${esc(v||"Not started")}</span>`;
const fin=r=>lc(r["Final System Acceptance"])==="accepted";
const es=r=>fin(r)?"Completed":ST.some(k=>r[k]&&lc(r[k])!=="not started")?"In progress":"Not started";
function prog(a){let d=0,t=0;a.forEach(r=>ST.forEach(k=>{const l=lc(r[k]);if(l==="not applicable")return;t++;if(DONE.includes(l))d++}));return t?Math.round(d/t*100):0}
const S=a=>{let d=0,p=0;a.forEach(r=>{const x=es(r);if(x==="Completed")d++;else if(x==="In progress")p++});return{t:a.length,d,p,n:a.length-d-p,pc:prog(a)}};
const pend=(a,k)=>a.filter(r=>{const l=lc(r[k]);return l!=="not applicable"&&!DONE.includes(l)}).length;
const pc=v=>`<td class="${v?"pn":"pz"}">${v}</td>`;
const pill=a=>{const p=a.length?prog(a):null;return`<span class="pl ${p===100?"g":p>0?"a":""}">${p===null?"–":p+"%"}</span>`};
const fd=v=>{if(!v)return"";const d=new Date(v);return isNaN(d)?esc(v):d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})};
const sbar=s=>{const t=s.t||1;return`<div class="sb">${[[s.d,"var(--gr)","Completed"],[s.p,"var(--am)","In progress"],[s.n,"var(--sl)","Not started"]].map(([x,c,l])=>x?`<i title="${l}: ${x}" style="width:${x/t*100}%;background:${c}"></i>`:"").join("")}</div>`};
const unitsAll=()=>{const s=[...UNITS];rows.forEach(r=>{if(!s.includes(r.Unit))s.push(r.Unit)});return s};
function tree(){return unitsAll().map((u,ui)=>{const a=rows.filter(r=>r.Unit===u);return{n:u,id:`unit-${ui+1}`,rs:a,ss:[...new Set(a.map(r=>r["System No."]))].map((s,si)=>({n:s,id:`system-${ui+1}-${si+1}`,rs:a.filter(r=>r["System No."]===s)}))}})}
function route(){T=tree();const h=location.hash.slice(1);let m;kf=null;sel={l:"p"};
if(m=h.match(/^unit-(\d+)$/)){const u=T[m[1]-1];if(u)sel={l:"u",u}}
else if(m=h.match(/^system-(\d+)-(\d+)$/)){const u=T[m[1]-1],s=u&&u.ss[m[2]-1];if(s)sel={l:"s",u,s}}
else if(m=h.match(/^eq-(\d+)$/)){const e=rows[m[1]-1];if(e){const u=T.find(x=>x.n===e.Unit);sel={l:"e",u,s:u.ss.find(x=>x.n===e["System No."]),e}}}
if(sel.u)open.add(sel.u.id);render()}
function treeH(){let h=`<div class="th" style="display:flex;justify-content:space-between;align-items:center">Select unit / system<button class="tg" onclick="dr(false)" aria-label="Close menu" style="width:auto;font-size:16px">✕</button></div><div style="padding:0 12px 8px"><input id="tq" placeholder="Search unit / system…" value="${esc(tq)}"></div><div class="tn ${sel.l==="p"?"on":""}"><span class="tg"></span><a href="#">▣ NREP Project</a>${pill(rows)}</div>`;
T.forEach(u=>{const tl=tq.toLowerCase(),um=u.n.toLowerCase().includes(tl),ms=u.ss.filter(s=>um||s.n.toLowerCase().includes(tl));if(tl&&!um&&!ms.length)return;const o=tl?true:open.has(u.id);h+=`<div class="tn l1 ${sel.l==="u"&&sel.u.id===u.id?"on":""}"><button class="tg" data-t="${u.id}">${o?"▾":"▸"}</button><a href="#${u.id}">${esc(u.n)}</a>${pill(u.rs)}</div>`;
if(o)(tl?ms:u.ss).forEach(s=>h+=`<div class="tn l2 ${sel.s&&sel.s.id===s.id&&sel.l!=="u"?"on":""}"><a href="#${s.id}" title="${esc(s.n)}">${esc(s.n)}</a>${pill(s.rs)}</div>`)});return h}
const head=(p,title)=>`<div class="bc">${p.map(([n,h])=>h!=null?`<a href="${h}">${esc(n)}</a>`:esc(n)).join(" › ")}</div><h2 class="t">${esc(title)}</h2>`;
const kb=(l,v,c="",f="")=>`<button class="k ${c}" data-f="${f}" title="Click to see details"><span>${l}</span><b>${v}</b></button>`;
function kp(a,x=""){const s=S(a);return`<div class="kp">${x}${kb("Equipment",s.t,"","all")}${kb("Completed",s.d,"gr","Completed")}${kb("In progress",s.p,"am","In progress")}${kb("Not started",s.n,"sl","Not started")}${kb("Stage progress",s.pc+"%","ac","prog")}</div><div id="kd"></div>`}
function ring(s){const t=s.t||1;let off=0;const c=[[s.d,"var(--gr)"],[s.p,"var(--am)"],[s.n,"var(--bd)"]].map(([v,col])=>{const l=v/t*100,o=`<circle r="15.9155" cx="18" cy="18" fill="none" stroke="${col}" stroke-width="5" stroke-dasharray="${l} ${100-l}" stroke-dashoffset="${-off}"/>`;off+=l;return o}).join("");
return`<div class="dn"><svg viewBox="0 0 36 36" width="140" height="140"><g transform="rotate(-90 18 18)">${c}</g><text x="18" y="19" text-anchor="middle" font-size="6" font-weight="700" fill="currentColor">${Math.round(s.d/t*100)}%</text><text x="18" y="23.5" text-anchor="middle" font-size="2.4" fill="currentColor">completed</text></svg><div class="dl"><div><b>${s.d}</b>Completed</div><div><b>${s.p}</b>In progress</div><div><b>${s.n}</b>Not started</div></div></div><div class="lg"><span><i style="background:var(--gr)"></i>Completed</span><span><i style="background:var(--am)"></i>In progress</span><span><i style="background:var(--bd)"></i>Not started</span></div>`}
function stg(a){const t=a.length||1;return ST.map((k,i)=>{let d=0,p=0,e=0,na=0;a.forEach(r=>{const l=lc(r[k]);if(!l||l==="not started")e++;else if(l==="not applicable")na++;else if(DONE.includes(l))d++;else p++});
return`<div class="sr"><span>${SH[i]}</span><div class="sb">${[[d,"var(--gr)","Done"],[p,"var(--am)","Pending / Open"],[e,"var(--sl)","Not started"],[na,"var(--bd)","N/A"]].map(([x,c,l])=>x?`<i title="${l}: ${x}" style="width:${x/t*100}%;background:${c}"></i>`:"").join("")}</div><b>${d}/${t-na}</b></div>`}).join("")+`<div class="lg"><span><i style="background:var(--gr)"></i>Done</span><span><i style="background:var(--am)"></i>Pending / Open</span><span><i style="background:var(--sl)"></i>Not started</span><span><i style="background:var(--bd)"></i>N/A</span></div>`}
